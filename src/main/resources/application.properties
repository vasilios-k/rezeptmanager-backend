spring.application.name=rezeptmanager-backend
server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.auth.issuer=${AUTH_ISSUER:https://rezeptmanager.eu.auth0.com/}
app.auth.audience=${AUTH_AUDIENCE:https://rezeptmanager-backend.onrender.com}
app.auth.legacy-owner-subject=${LEGACY_OWNER_SUBJECT:}